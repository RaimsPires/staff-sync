[project]
name = "staffsync"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TechShin0bi", email = "raimspires20@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.0",
    "arq>=0.25.0",
    "asyncpg>=0.32.0",
    "authlib>=1.9.1",
    "babel>=2.18.0",
    "fastapi>=0.148.0",
    "fastapi-mail>=1.6.8",
    "firebase-admin>=7.7.0",
    "geoalchemy2>=0.20.0",
    "openpyxl>=3.1.5",
    "phonenumbers>=9.0.41",
    "pillow>=13.0.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "pyotp>=2.10.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "segno>=1.6.6",
    "sentry-sdk>=2.72.0",
    "shapely>=2.2.0",
    "slowapi>=0.1.10",
    "sqlmodel>=0.0.48",
    "stripe>=16.0.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[project.scripts]
staffsync = "staffsync:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

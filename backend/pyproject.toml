[project]
name = "staffsync"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TechShin0bi", email = "raimspires20@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.0",
    "arq>=0.25.0",
    "asyncpg>=0.32.0",
    "babel>=2.18.0",
    "fastapi>=0.148.0",
    "fastapi-mail>=1.6.8",
    "geoalchemy2>=0.20.0",
    "google-auth>=2.62.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "phonenumbers>=9.0.41",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "segno>=1.6.6",
    "sentry-sdk>=2.72.0",
    "shapely>=2.2.0",
    "slowapi>=0.1.10",
    "sqlmodel>=0.0.48",
    "stripe>=16.0.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[project.scripts]
staffsync = "staffsync:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "freezegun>=1.5.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "testcontainers>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "E741", "B007", "B905"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0B67DD;text-decoration:none}a:hover{color:#0957BD;text-decoration:underline}
[data-theme=light]{--bg:#F4F6F9;--surface:#FFFFFF;--surface-2:#F8F9FB;--hover:#F1F4F8;--border:#E3E7ED;--border-strong:#CDD4DE;--text:#0D1B2E;--text-2:#4A5668;--text-3:#6F7A8B;--accent:#0B67DD;--accent-hover:#0957BD;--accent-soft:#E8F0FC;--fence:rgba(11,103,221,.12);--sidebar:#FFFFFF;--ok:#0F7A3F;--ok-bg:#E5F4EA;--ok-dot:#16A34A;--warn:#8F5300;--warn-bg:#FCF0D6;--warn-dot:#E59A00;--bad:#B9241A;--bad-bg:#FCE9E7;--bad-dot:#E5372A;--info:#2E45BF;--info-bg:#EBEEFC;--info-dot:#4F6BED;--orange:#A9420B;--orange-bg:#FCECE0;--orange-dot:#EA6A1F;--violet:#6236C2;--violet-bg:#F0EAFC;--violet-dot:#8B5CF6;--neutral:#4A5668;--neutral-bg:#EEF1F5;--neutral-dot:#97A1B0;--map-bg:#ECEFEA;--map-road:#FFFFFF;--map-block:#E1E6DD;--map-water:#D3E4F2;--shadow:0 1px 2px rgba(13,27,46,.05),0 1px 3px rgba(13,27,46,.04);--shadow-lg:0 12px 40px rgba(13,27,46,.16);--overlay:rgba(13,27,46,.32)}
[data-theme=dark]{--bg:#0A0F17;--surface:#111823;--surface-2:#0E141E;--hover:#18212E;--border:#1F2A39;--border-strong:#2C3A4E;--text:#E7EDF5;--text-2:#A5B1C2;--text-3:#7F8CA0;--accent:#3B8BFF;--accent-hover:#5C9EFF;--accent-soft:rgba(59,139,255,.15);--fence:rgba(59,139,255,.16);--sidebar:#0D131D;--ok:#4ADE80;--ok-bg:rgba(34,197,94,.14);--ok-dot:#22C55E;--warn:#FBBF24;--warn-bg:rgba(245,158,11,.15);--warn-dot:#F59E0B;--bad:#F87171;--bad-bg:rgba(239,68,68,.15);--bad-dot:#EF4444;--info:#9AABFF;--info-bg:rgba(99,123,255,.16);--info-dot:#6F86FF;--orange:#FB923C;--orange-bg:rgba(249,115,22,.15);--orange-dot:#F97316;--violet:#C0A6FF;--violet-bg:rgba(139,92,246,.17);--violet-dot:#8B5CF6;--neutral:#A5B1C2;--neutral-bg:rgba(148,163,184,.12);--neutral-dot:#64748B;--map-bg:#121B26;--map-road:#1C2735;--map-block:#0F1721;--map-water:#0F2539;--shadow:none;--shadow-lg:0 16px 48px rgba(0,0,0,.5);--overlay:rgba(0,0,0,.55)}
@keyframes ssPulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@keyframes ssIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ssDrawer{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes ssShimmer{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
input,select,textarea,button{font-family:inherit}
input[type=range]{accent-color:#0B67DD}
@keyframes ssSpin{to{transform:rotate(360deg)}}
@keyframes ssFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
</helmet>
<div style="min-height:100vh;position:relative">
<sc-if value="{{ isSignin }}" hint-placeholder-val="{{ true }}">
<dc-import name="SignIn" dc-props="{{ siP }}" hint-size="100%,100vh"></dc-import>
</sc-if>
<sc-if value="{{ isInvite }}">
<dc-import name="Invite" dc-props="{{ ivP }}" hint-size="100%,100vh"></dc-import>
</sc-if>
<sc-if value="{{ isWorkspaces }}">
<dc-import name="Workspaces" dc-props="{{ wsP }}" hint-size="100%,100vh"></dc-import>
</sc-if>
<sc-if value="{{ isOnboarding }}">
<dc-import name="Onboarding" dc-props="{{ obP }}" hint-size="100%,100vh"></dc-import>
</sc-if>
<sc-if value="{{ isAdmin }}">
<dc-import name="Admin" dc-props="{{ adP }}" hint-size="100%,100vh"></dc-import>
</sc-if>
<sc-if value="{{ showSwitcher }}" hint-placeholder-val="{{ true }}">
    <div style="position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;align-items:center;font-family:'Geist',system-ui,sans-serif">
      <button onClick="{{ toggleMenu }}" style="display:flex;align-items:center;gap:7px;height:26px;padding:0 12px;border:0;border-radius:0 0 10px 10px;background:#0D1B2E;color:#fff;font-size:12px;font-weight:500;cursor:pointer;box-shadow:0 4px 14px rgba(13,27,46,.25)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"></path></svg>
        <span>{{ currentLabel }}</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{ chevron }}"></path></svg>
      </button>
      <sc-if value="{{ menuOpen }}">
        <div style="margin-top:8px;width:300px;max-height:75vh;overflow:auto;background:#fff;color:#0D1B2E;border:1px solid #E3E7ED;border-radius:12px;box-shadow:0 16px 48px rgba(13,27,46,.22);padding:8px">
          <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
            <div style="padding:8px 8px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6F7A8B">{{ g.label }}</div>
            <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
              <button onClick="{{ it.go }}" style="display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:8px;background:{{ it.bg }};color:{{ it.fg }};font-size:13px;font-weight:500;cursor:pointer;text-align:left" style-hover="background:#F1F4F8">
                <span style="flex:1">{{ it.label }}</span>
                <sc-if value="{{ it.soon }}"><span style="font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:#EEF1F5;color:#6F7A8B">Upcoming</span></sc-if>
                <sc-if value="{{ it.active }}"><span style="width:6px;height:6px;border-radius:50%;background:#0B67DD"></span></sc-if>
              </button>
            </sc-for>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;signin&quot;,&quot;invite&quot;,&quot;workspaces&quot;,&quot;onboarding&quot;,&quot;dashboard&quot;,&quot;live&quot;,&quot;attendance&quot;,&quot;alerts&quot;,&quot;employees&quot;,&quot;sites&quot;,&quot;schedules&quot;,&quot;leave&quot;,&quot;reports&quot;,&quot;users&quot;,&quot;audit&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;signin&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Navigation&quot;},&quot;showSwitcher&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Navigation&quot;},&quot;sidebar&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;expanded&quot;,&quot;collapsed&quot;],&quot;default&quot;:&quot;expanded&quot;,&quot;tsType&quot;:&quot;'expanded'|'collapsed'&quot;,&quot;section&quot;:&quot;App shell&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;desktop&quot;,&quot;tablet&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;'auto'|'desktop'|'tablet'&quot;,&quot;section&quot;:&quot;App shell&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;branch&quot;,&quot;site&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;'admin'|'branch'|'site'&quot;,&quot;section&quot;:&quot;Access&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;fr&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;'en'|'fr'&quot;,&quot;section&quot;:&quot;Display&quot;},&quot;dashState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;new&quot;],&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;'live'|'new'&quot;,&quot;section&quot;:&quot;States&quot;},&quot;recordsState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;empty&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;'normal'|'empty'&quot;,&quot;section&quot;:&quot;States&quot;},&quot;signinState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;loading&quot;,&quot;wrong&quot;,&quot;locked&quot;,&quot;deactivated&quot;,&quot;offline&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;States&quot;},&quot;inviteState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;valid&quot;,&quot;expired&quot;,&quot;used&quot;],&quot;default&quot;:&quot;valid&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;States&quot;},&quot;onboardingStep&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:1,&quot;max&quot;:9,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;States&quot;}}">
const KEY='staffsync-route';
const SCREENS=[
  {group:'Access',items:[['signin','Sign in'],['invite','Accept invitation'],['workspaces','Workspace switcher'],['onboarding','Create company account']]},
  {group:'Admin',items:[['dashboard','Overview'],['live','Live board'],['attendance','Attendance'],['alerts','Alerts & fraud'],['employees','Employees'],['sites','Branches & Sites'],['schedules','Schedules'],['leave','Leave requests'],['reports','Reports'],['users','Users & Roles'],['audit','Audit log'],['settings','Settings'],['profile','My profile']]}
];
const ADMIN=new Set(['dashboard','live','attendance','alerts','employees','sites','schedules','leave','reports','users','audit','settings','profile']);

class Component extends DCLogic {
  state={route:null,adminPage:'dashboard',nonce:0,menu:false,role:null,obStep:null};
  nav=(t,o)=>this.navigate(t,o);
  pageChange=p=>{ if(p!==this.state.adminPage) this.setState({adminPage:p},()=>this.persist()); };
  searchableSelects(){
    const MIN=7;let pop=null,cleanup=null;
    const close=()=>{if(pop){pop.remove();pop=null;}if(cleanup){cleanup();cleanup=null;}};
    const setVal=(sel,v)=>{Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value').set.call(sel,v);sel.dispatchEvent(new Event('change',{bubbles:true}));};
    const open=sel=>{
      close();
      const opts=Array.from(sel.options).filter(o=>!o.disabled);
      const host=sel.closest('[data-theme]')||document.body,r=sel.getBoundingClientRect();
      const below=window.innerHeight-r.bottom>300,w=Math.max(r.width,220);
      pop=document.createElement('div');
      pop.setAttribute('data-ss-pop','1');
      pop.style.cssText='position:fixed;z-index:300;left:'+Math.min(r.left,window.innerWidth-w-8)+'px;'+(below?'top:'+(r.bottom+4)+'px':'bottom:'+(window.innerHeight-r.top+4)+'px')+';width:'+w+'px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden;font-family:inherit';
      const inp=document.createElement('input');
      inp.placeholder='Search…';inp.setAttribute('aria-label','Search options');
      inp.style.cssText='width:100%;box-sizing:border-box;height:38px;padding:0 12px;border:0;border-bottom:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13px;outline:none';
      const list=document.createElement('div');list.setAttribute('role','listbox');list.style.cssText='max-height:240px;overflow-y:auto;padding:4px';
      pop.appendChild(inp);pop.appendChild(list);host.appendChild(pop);
      let act=0,shown=[];
      const render=()=>{
        const q=inp.value.trim().toLowerCase();
        shown=opts.filter(o=>!q||o.text.toLowerCase().includes(q));
        if(act>=shown.length)act=Math.max(0,shown.length-1);
        list.innerHTML='';
        if(!shown.length){const e=document.createElement('div');e.textContent='No matches';e.style.cssText='padding:12px;font-size:13px;color:var(--text-3);text-align:center';list.appendChild(e);return;}
        shown.forEach((o,i)=>{const it=document.createElement('div');it.setAttribute('role','option');it.textContent=o.text;
          const cur=o.value===sel.value;
          it.style.cssText='padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--text);display:flex;justify-content:space-between;gap:8px;background:'+(i===act?'var(--hover)':'transparent')+(cur?';font-weight:600':'');
          if(cur){const c=document.createElement('span');c.textContent='✓';c.style.color='var(--accent)';it.appendChild(c);}
          it.onmouseenter=()=>{act=i;render2();};it.onmousedown=ev=>{ev.preventDefault();pick(o);};list.appendChild(it);});
      };
      const render2=()=>{Array.from(list.children).forEach((c,i)=>{c.style.background=i===act?'var(--hover)':'transparent';});};
      const pick=o=>{close();setVal(sel,o.value);sel.focus();};
      inp.oninput=()=>{act=0;render();};
      inp.onkeydown=ev=>{
        if(ev.key==='Escape'){ev.preventDefault();close();sel.focus();}
        else if(ev.key==='ArrowDown'){ev.preventDefault();act=Math.min(shown.length-1,act+1);render2();const el=list.children[act];if(el&&el.scrollIntoView===undefined){}if(el)list.scrollTop=Math.max(0,el.offsetTop-80);}
        else if(ev.key==='ArrowUp'){ev.preventDefault();act=Math.max(0,act-1);render2();const el=list.children[act];if(el)list.scrollTop=Math.max(0,el.offsetTop-80);}
        else if(ev.key==='Enter'){ev.preventDefault();if(shown[act])pick(shown[act]);}
      };
      render();
      const idx=shown.findIndex(o=>o.value===sel.value);if(idx>0){act=idx;render();setTimeout(()=>{const el=list.children[idx];if(el)list.scrollTop=Math.max(0,el.offsetTop-80);},0);}
      setTimeout(()=>inp.focus(),0);
      const out=ev=>{if(pop&&!pop.contains(ev.target))close();};
      const away=ev=>{if(pop&&!pop.contains(ev.target))close();};
      document.addEventListener('mousedown',out,true);window.addEventListener('resize',close);window.addEventListener('scroll',away,true);
      cleanup=()=>{document.removeEventListener('mousedown',out,true);window.removeEventListener('resize',close);window.removeEventListener('scroll',away,true);};
    };
    const isBig=t=>t&&t.tagName==='SELECT'&&!t.disabled&&!t.multiple&&t.options.length>=MIN;
    this._ssDown=ev=>{const s=ev.target&&ev.target.closest?ev.target.closest('select'):null;if(isBig(s)&&!(pop&&pop.contains(ev.target))){ev.preventDefault();ev.stopPropagation();s.focus();open(s);}};
    this._ssKey=ev=>{const s=ev.target;if(isBig(s)&&[' ','Enter','ArrowDown','ArrowUp'].includes(ev.key)){ev.preventDefault();open(s);}};
    document.addEventListener('mousedown',this._ssDown,true);document.addEventListener('keydown',this._ssKey,true);
    this._ssOff=()=>{close();document.removeEventListener('mousedown',this._ssDown,true);document.removeEventListener('keydown',this._ssKey,true);};
  }
  componentDidMount(){
    this.searchableSelects();
    this._alive=true;
    const ss=this.props.startScreen;
    if(ss&&ADMIN.has(ss)) this.setState({adminPage:ss});
  }
  componentDidUpdate(pp){
    if(pp.startScreen!==this.props.startScreen&&this.props.startScreen) this.navigate(this.props.startScreen);
    if(pp.role!==this.props.role&&this.state.role) this.setState({role:null});
  }
  componentWillUnmount(){ this._alive=false; if(this._ssOff)this._ssOff(); }
  route(){ const r=this.state.route||this.props.startScreen||'signin'; return ADMIN.has(r)?'admin':r; }
  persist(){ try{localStorage.setItem(KEY,JSON.stringify({route:this.route(),adminPage:this.state.adminPage}));}catch(e){} }
  navigate(target,opts){
    opts=opts||{};
    const patch={menu:false,obStep:target==='onboarding'?(opts.step||null):null};
    if(opts.role) patch.role=opts.role;
    if(ADMIN.has(target)) this.setState(s=>Object.assign(patch,{route:'admin',adminPage:target,nonce:s.nonce+1}),()=>this.persist());
    else this.setState(Object.assign(patch,{route:target}),()=>this.persist());
    window.scrollTo(0,0);
  }
  subProps(k){
    const n=this._sp(k), o=this._spc=this._spc||{}, p=o[k];
    if(p&&Object.keys(n).every(x=>n[x]===p[x])&&Object.keys(p).length===Object.keys(n).length) return p;
    return o[k]=n;
  }
  _sp(k){
    const P=this.props,s=this.state;
    if(k==='signin') return {onNavigate:this.nav,theme:P.theme,lang:P.lang,previewState:P.signinState};
    if(k==='invite') return {onNavigate:this.nav,theme:P.theme,lang:P.lang,inviteState:P.inviteState};
    if(k==='workspaces') return {onNavigate:this.nav,theme:P.theme,lang:P.lang};
    if(k==='onboarding') return {onNavigate:this.nav,theme:P.theme,startStep:s.obStep||P.onboardingStep};
    return {onNavigate:this.nav,onPageChange:this.pageChange,initialPage:s.adminPage,pageNonce:s.nonce,theme:P.theme,lang:P.lang,role:s.role||P.role,sidebar:P.sidebar,layout:P.layout,dashState:P.dashState,recordsState:P.recordsState};
  }
  renderVals(){
    const r=this.route(), s=this.state;
    const out={siP:this.subProps('signin'),ivP:this.subProps('invite'),wsP:this.subProps('workspaces'),obP:this.subProps('onboarding'),adP:this.subProps('admin')};
    const activeKey=r==='admin'?s.adminPage:r;
    const cur=SCREENS.flatMap(g=>g.items).find(i=>i[0]===activeKey);
    return Object.assign(out,{
      isSignin:r==='signin',isInvite:r==='invite',isWorkspaces:r==='workspaces',isOnboarding:r==='onboarding',isAdmin:r==='admin',
      showSwitcher:this.props.showSwitcher!==false,menuOpen:s.menu,toggleMenu:()=>this.setState({menu:!s.menu}),chevron:s.menu?'M18 15l-6-6-6 6':'M6 9l6 6 6-6',
      currentLabel:cur?cur[1]:'Screens',
      groups:SCREENS.map(g=>({label:g.group,items:g.items.map(([k,label,soon])=>({label,soon:!!soon,active:k===activeKey,bg:k===activeKey?'#E8F0FC':'transparent',fg:k===activeKey?'#0B67DD':'#0D1B2E',go:()=>this.navigate(k)}))}))
    });
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:12px">
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <div style="display:flex;border:1px solid var(--border-strong);border-radius:9px;overflow:hidden"><sc-for list="{{ c.scales }}" as="v" hint-placeholder-count="2"><button onClick="{{ v.go }}" style="height:34px;padding:0 14px;border:0;background:{{ v.bg }};color:{{ v.fg }};font-size:13px;font-weight:500;cursor:pointer">{{ v.l }}</button></sc-for></div>
    <div style="display:flex;align-items:center;gap:4px"><button onClick="{{ c.prev }}" aria-label="Previous" style="width:34px;height:34px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;font-size:16px">‹</button><button onClick="{{ c.today }}" style="height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer">Today</button><button onClick="{{ c.next }}" aria-label="Next" style="width:34px;height:34px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;font-size:16px">›</button></div>
    <div style="font-weight:600;font-size:15px;min-width:140px">{{ c.range }}</div>
    <div style="display:flex;border:1px solid var(--border-strong);border-radius:9px;overflow:hidden"><sc-for list="{{ c.groups }}" as="v" hint-placeholder-count="2"><button onClick="{{ v.go }}" style="height:34px;padding:0 12px;border:0;background:{{ v.bg }};color:{{ v.fg }};font-size:13px;cursor:pointer">{{ v.l }}</button></sc-for></div>
    <sc-for list="{{ c.filters }}" as="f" hint-placeholder-count="5"><select value="{{ f.val }}" onChange="{{ f.on }}" style="height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:13px;max-width:170px"><sc-for list="{{ f.opts }}" as="o" hint-placeholder-count="3"><option value="{{ o.v }}">{{ o.l }}</option></sc-for></select></sc-for>
    <button onClick="{{ c.togOnly }}" style="height:34px;padding:0 12px;border-radius:999px;border:1px solid {{ c.onlyBd }};background:{{ c.onlyBg }};color:{{ c.onlyFg }};font-size:13px;font-weight:500;cursor:pointer">Only people off</button>
  </div>

  <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-2);align-items:center"><sc-for list="{{ c.legend }}" as="l" hint-placeholder-count="5"><span style="display:flex;align-items:center;gap:6px"><span style="width:20px;height:11px;border-radius:3px;background:{{ l.bg }}"></span>{{ l.l }}</span></sc-for><span style="display:flex;align-items:center;gap:6px"><span style="width:20px;height:11px;border-radius:3px;border:1px solid var(--info);background:repeating-linear-gradient(135deg,var(--info) 0 2px,transparent 2px 6px),var(--info-bg)"></span>Pending (hatched)</span><span style="display:flex;align-items:center;gap:6px"><span style="width:11px;height:11px;border-radius:3px;background:var(--warn-bg);border:1px solid var(--warn-dot)"></span>Public holiday</span></div>

  <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow-x:auto">
    <div style="width:{{ c.totalW }}px">
      <div style="display:flex;border-bottom:1px solid var(--border);background:var(--surface-2)">
        <div style="flex:none;width:190px;position:sticky;left:0;z-index:3;background:var(--surface-2);padding:8px 14px;font-size:11.5px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:flex-end;border-right:1px solid var(--border);box-sizing:border-box">Employee</div>
        <div style="flex:none;width:{{ c.trackW }}px"><div style="display:flex;border-bottom:1px solid var(--border)"><sc-for list="{{ c.months }}" as="m" hint-placeholder-count="3"><div style="flex:none;width:{{ m.w }}px;padding:5px 8px;font-size:12px;font-weight:600;color:var(--text);border-left:1px solid var(--border);box-sizing:border-box;white-space:nowrap;overflow:hidden">{{ m.l }}</div></sc-for></div>
          <div style="display:flex"><sc-for list="{{ c.days }}" as="d" hint-placeholder-count="30"><div title="{{ d.tip }}" style="flex:none;width:{{ c.cw }}px;height:34px;box-sizing:border-box;border-left:1px solid var(--border);background:{{ d.bg }};color:{{ d.fg }};text-align:center;font-size:10.5px;line-height:1.15;padding-top:4px"><div style="font-weight:600;font-size:11px">{{ d.n }}</div><div style="opacity:.8">{{ d.w }}</div></div></sc-for></div></div>
      </div>
      <sc-for list="{{ c.grps }}" as="g" hint-placeholder-count="3">
        <div>
          <div style="display:flex;background:var(--surface-2);border-bottom:1px solid var(--border)"><div style="flex:none;width:190px;position:sticky;left:0;z-index:2;background:var(--surface-2);padding:7px 14px;font-size:12.5px;font-weight:600;border-right:1px solid var(--border);box-sizing:border-box">{{ g.name }}</div><div style="padding:7px 12px;font-size:12px;color:var(--text-3);white-space:nowrap">{{ g.sub }}</div></div>
          <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="4">
            <div style="display:flex;border-bottom:1px solid var(--border)">
              <div style="flex:none;width:190px;position:sticky;left:0;z-index:2;background:var(--surface);padding:7px 14px;border-right:1px solid var(--border);box-sizing:border-box;display:flex;flex-direction:column;justify-content:center"><div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.name }}</div><div style="font-size:11.5px;color:var(--text-3)">{{ r.sub }}</div></div>
              <div style="flex:none;position:relative;width:{{ c.trackW }}px;height:40px;display:flex">
                <sc-for list="{{ c.cells }}" as="x" hint-placeholder-count="30"><div style="flex:none;width:{{ c.cw }}px;height:40px;box-sizing:border-box;border-left:1px solid var(--border);background:{{ x.bg }}"></div></sc-for>
                <sc-for list="{{ r.bars }}" as="b" hint-placeholder-count="1"><div onClick="{{ b.go }}" title="{{ b.tip }}" style="position:absolute;left:{{ b.x }}px;top:7px;width:{{ b.w }}px;height:26px;box-sizing:border-box;border-radius:6px;background:{{ b.bg }};border:{{ b.bd }};color:{{ b.fg }};padding:0 7px;font-size:11.5px;font-weight:600;display:flex;align-items:center;white-space:nowrap;overflow:hidden;cursor:pointer">{{ b.l }}</div></sc-for>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-for>
      <sc-if value="{{ c.empty }}"><div style="padding:48px 16px;text-align:center;color:var(--text-3);font-size:13.5px">No employees match the filters.</div></sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object[]&quot;},&quot;people&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[][]&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;}}">
const SN={pd:['Part-Dieu Tower','Lyon'],cf:['Confluence Depot','Lyon'],sd:['Saint-Denis Hub','Paris Nord'],rl:['Roissy Logistics','Paris Nord'],pv:['Port Vieux Yard','Marseille']};
const TY={annual:['Annual leave','var(--info)','var(--info-bg)'],rtt:['RTT','var(--violet)','var(--violet-bg)'],sick:['Sick leave','var(--orange)','var(--orange-bg)'],family:['Family event','var(--ok)','var(--ok-bg)'],unpaid:['Unpaid','var(--neutral)','var(--neutral-bg)']};
const HOL={'2026-11-01':'All Saints','2026-11-11':'Armistice Day','2026-12-25':'Christmas Day'};
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'],DL=['M','T','W','T','F','S','S'],DAY=864e5;
const pms=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d);};
const iso=t=>new Date(t).toISOString().slice(0,10),dow=t=>(new Date(t).getUTCDay()+6)%7;
const TODAY=pms('2026-10-15');
class Component extends DCLogic {
  state={scale:'month',anchor:TODAY,br:'all',site:'all',type:'all',emp:'all',status:'all',group:'site',only:false};
  period(){const s=this.state,a=new Date(s.anchor),y=a.getUTCFullYear(),m=a.getUTCMonth();if(s.scale==='month')return{a:Date.UTC(y,m,1),b:Date.UTC(y,m+1,0)};const q=Math.floor(m/3)*3;return{a:Date.UTC(y,q,1),b:Date.UTC(y,q+3,0)};}
  shift(n){const a=new Date(this.state.anchor),step=this.state.scale==='month'?1:3;this.setState({anchor:Date.UTC(a.getUTCFullYear(),a.getUTCMonth()+n*step,1)});}
  renderVals(){return {c:this.rv()};}
  rv(){
    const s=this.state,p=this.props,P=this.period(),n=Math.round((P.b-P.a)/DAY)+1,cw=s.scale==='month'?32:Math.max(10,Math.floor(1080/n));
    const people=p.people||[],items=(p.items||[]).filter(r=>(r.status==='approved'||r.status==='pending')&&(s.status==='all'||r.status===s.status)&&(s.type==='all'||r.type===s.type));
    const set=k=>ev=>this.setState({[k]:ev.target.value});
    const days=[],cells=[];
    for(let i=0;i<n;i++){const t=P.a+i*DAY,d=new Date(t),w=dow(t),h=HOL[iso(t)],tod=t===TODAY,wk=w>=5;
      const showN=s.scale==='month'||w===0||d.getUTCDate()===1;
      days.push({n:showN?d.getUTCDate():'',w:s.scale==='month'?DL[w]:'',tip:h?h+' (public holiday)':'',bg:h?'var(--warn-bg)':tod?'var(--accent-soft)':wk?'var(--surface-2)':'transparent',fg:h?'var(--warn)':tod?'var(--accent)':'var(--text-3)'});
      cells.push({bg:h?'var(--warn-bg)':tod?'var(--accent-soft)':wk?'var(--surface-2)':'transparent'});}
    const months=[];for(let t=P.a;t<=P.b;){const d=new Date(t),e=Math.min(P.b,Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)),len=Math.round((e-t)/DAY)+1;months.push({l:MN[d.getUTCMonth()]+' '+d.getUTCFullYear(),w:len*cw});t=e+DAY;}
    const sitesA=Object.keys(SN).filter(k=>s.br==='all'||SN[k][1]===s.br);
    const ppl=people.filter(x=>(s.br==='all'||SN[x[1]][1]===s.br)&&(s.site==='all'||x[1]===s.site)&&(s.emp==='all'||x[0]===s.emp));
    const barsOf=name=>items.filter(r=>r.emp===name&&pms(r.to)>=P.a&&pms(r.from)<=P.b).map(r=>{const f=Math.max(pms(r.from),P.a),e=Math.min(pms(r.to),P.b),t=TY[r.type],pend=r.status==='pending',w=(Math.round((e-f)/DAY)+1)*cw-2;
      const half=r.half?'½ day':r.days+(r.days===1?' day':' days');
      return {x:Math.round((f-P.a)/DAY)*cw+1,w,l:w>=72?t[0].split(' ')[0]+' · '+half:w>=38?(r.half?'½d':r.days+'d'):'',
        bg:pend?'repeating-linear-gradient(135deg,'+t[1]+' 0 2px,transparent 2px 7px),'+t[2]:t[1],bd:'1px solid '+t[1],fg:pend?t[1]:'#fff',
        tip:r.emp+' · '+t[0]+' · '+half+' · '+r.from.slice(5)+(r.from===r.to?'':' → '+r.to.slice(5))+' · '+(pend?'Pending':'Approved'),go:()=>p.onOpen&&p.onOpen(r.id)};});
    const keyOf=x=>s.group==='site'?x[1]:SN[x[1]][1];
    const keys=[...new Set(ppl.map(keyOf))];
    const grps=keys.map(k=>{let rows=ppl.filter(x=>keyOf(x)===k).map(x=>({name:x[0],sub:x[2]+' · '+SN[x[1]][0].split(' ')[0],bars:barsOf(x[0])}));if(s.only)rows=rows.filter(r=>r.bars.length);
      let peak=0;for(let i=0;i<n;i++){const t=P.a+i*DAY;const c=new Set(items.filter(r=>keyOf([0,r.site])===k&&pms(r.from)<=t&&pms(r.to)>=t).map(r=>r.emp)).size;if(c>peak)peak=c;}
      return {name:s.group==='site'?SN[k][0]:k,sub:rows.length+' employee'+(rows.length===1?'':'s')+(peak?' · peak '+peak+' off at once':' · nobody off'),rows};}).filter(g=>g.rows.length);
    const a=new Date(P.a);
    return {
      scales:[['month','Month'],['quarter','Quarter']].map(([k,l])=>({l,bg:s.scale===k?'var(--accent)':'var(--surface)',fg:s.scale===k?'#fff':'var(--text-2)',go:()=>this.setState({scale:k})})),
      prev:()=>this.shift(-1),next:()=>this.shift(1),today:()=>this.setState({anchor:TODAY}),
      range:s.scale==='month'?MN[a.getUTCMonth()]+' '+a.getUTCFullYear():'Q'+(Math.floor(a.getUTCMonth()/3)+1)+' '+a.getUTCFullYear(),
      groups:[['site','By site'],['branch','By branch']].map(([k,l])=>({l,bg:s.group===k?'var(--accent)':'var(--surface)',fg:s.group===k?'#fff':'var(--text-2)',go:()=>this.setState({group:k})})),
      filters:[{val:s.br,on:ev=>this.setState({br:ev.target.value,site:'all',emp:'all'}),opts:[{v:'all',l:'All branches'}].concat(['Lyon','Paris Nord','Marseille'].map(b=>({v:b,l:b})))},{val:s.site,on:set('site'),opts:[{v:'all',l:'All sites'}].concat(sitesA.map(k=>({v:k,l:SN[k][0]})))},{val:s.type,on:set('type'),opts:[{v:'all',l:'All leave types'}].concat(Object.keys(TY).map(k=>({v:k,l:TY[k][0]})))},{val:s.status,on:set('status'),opts:[{v:'all',l:'Approved + pending'},{v:'approved',l:'Approved only'},{v:'pending',l:'Pending only'}]},{val:s.emp,on:set('emp'),opts:[{v:'all',l:'All employees'}].concat(people.map(x=>x[0]).sort().map(x=>({v:x,l:x})))}],
      onlyBg:s.only?'var(--accent)':'var(--surface)',onlyFg:s.only?'#fff':'var(--text-2)',onlyBd:s.only?'var(--accent)':'var(--border-strong)',togOnly:()=>this.setState({only:!s.only}),
      legend:Object.keys(TY).map(k=>({l:TY[k][0],bg:TY[k][1]})),cw,trackW:n*cw,totalW:190+n*cw,months,days,cells,grps,empty:grps.length===0
    };
  }
}
</script>
</body>
</html>

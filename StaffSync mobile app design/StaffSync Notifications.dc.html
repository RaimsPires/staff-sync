<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./nav-bridge.js"></script><meta name="design_doc_mode" content="canvas"><style>body{margin:0;background:#E9EEF5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}a{color:#0A6AE6}a:hover{color:#0B2A52}button{font-family:inherit}</style></helmet>
<div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:32px">
<div style="display:flex;gap:8px"><sc-for list="{{ scens }}" as="sc" hint-placeholder-count="2"><button onClick="{{ sc.go }}" style="min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #0B2A52;background:#fff;color:#0B2A52;font-weight:700;font-size:13px;cursor:pointer">{{ sc.label }}</button></sc-for></div>
<div style="width:390px;height:800px;background:#F5F8FC;color:#0B2A52;border-radius:36px;box-shadow:0 20px 60px rgba(11,42,82,.3);overflow:hidden;display:flex;flex-direction:column;position:relative">
<div style="height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:15px;font-weight:600"><span>09:41</span><span>●●● 4G</span></div>
<div style="flex:none;display:flex;justify-content:space-between;align-items:center;padding:4px 20px 8px"><div style="display:flex;align-items:center;gap:8px"><button aria-label="Back" style="width:44px;height:44px;border-radius:50%;border:1px solid #DCE4EF;background:#fff;color:#0B2A52;font-size:22px;cursor:pointer">‹</button><div style="font-size:26px;font-weight:800">Alerts</div></div><button onClick="{{ markAll }}" style="min-height:44px;padding:0 6px;border:0;background:none;color:{{ markCol }};font-size:14px;font-weight:800;cursor:pointer">Mark all as read</button></div>
<div style="flex:1;overflow:auto;padding:0 20px 16px;display:flex;flex-direction:column;gap:8px">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
<sc-if value="{{ r.isHead }}" hint-placeholder-val="{{ false }}"><div style="flex:none;font-size:13px;font-weight:800;color:#51627D;text-transform:uppercase;letter-spacing:.06em;padding:10px 4px 0">{{ r.head }}</div></sc-if>
<sc-if value="{{ r.isItem }}" hint-placeholder-val="{{ true }}"><div style="flex:none;position:relative;border-radius:18px;overflow:hidden;background:{{ r.wbg }}"><button onClick="{{ r.del }}" aria-label="Delete" style="position:absolute;right:0;top:0;bottom:0;width:88px;border:0;background:#DC2626;visibility:{{ r.dv }};color:#fff;font-size:14px;font-weight:800;cursor:pointer">Delete</button>
<div onPointerDown="{{ r.down }}" onPointerMove="{{ r.move }}" onPointerUp="{{ r.up }}" style="position:relative;transform:translateX({{ r.x }}px);transition:{{ r.tr }};touch-action:pan-y;user-select:none;background:{{ r.bg }};border:1px solid #DCE4EF;border-radius:18px;padding:12px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;min-height:44px">
<span style="width:40px;height:40px;border-radius:12px;background:{{ r.ibg }};color:{{ r.ifg }};display:flex;align-items:center;justify-content:center;font-size:19px;flex:none">{{ r.icon }}</span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><div style="display:flex;justify-content:space-between;gap:8px"><span style="font-size:15px;font-weight:{{ r.w }}">{{ r.title }}</span><span style="font-size:12px;color:#51627D;flex:none">{{ r.time }}</span></div><div style="font-size:14px;color:#51627D;line-height:1.35">{{ r.text }}</div><div style="font-size:13px;font-weight:700;color:#0A6AE6;margin-top:2px">{{ r.go }} ›</div></div>
<span style="width:10px;height:10px;border-radius:50%;background:#0A6AE6;flex:none;margin-top:6px;visibility:{{ r.dot }}" aria-label="Unread"></span></div></div></sc-if>
</sc-for>
<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div style="flex:none;margin-top:60px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 20px"><div style="width:72px;height:72px;border-radius:50%;background:#EEF3FA;display:flex;align-items:center;justify-content:center;font-size:32px">🔔︎</div><div style="font-size:20px;font-weight:800">You're all caught up</div><div style="font-size:14px;color:#51627D;line-height:1.4">Shift reminders, schedule changes and leave decisions will appear here.</div></div></sc-if>
</div>
<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:20px;right:20px;bottom:24px;background:#0B2A52;color:#fff;border-radius:14px;padding:14px;font-size:15px;font-weight:700;text-align:center">{{ toast }}</div></sc-if>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { items: null, off: {}, toast: '', drag: null };
  componentDidMount() { this.setState({ items: this.seed() }); }
  seed() {
    const T = {
      shift: ['⏰︎', '#E6EEFA', '#0A4DA8', 'Schedule'], sched: ['▦', '#FEF3C7', '#7C3A06', 'Schedule'], out: ['⏻︎', '#FFEDD5', '#9A3412', 'Check-out'],
      flag: ['⚑', '#FEE2E2', '#991B1B', 'Attendance detail'], ok: ['✓', '#DCFCE7', '#14532D', 'Attendance detail'], leave: ['☀︎', '#DCFCE7', '#14532D', 'Leave request'],
      no: ['✕', '#FEE2E2', '#991B1B', 'Leave request'], chg: ['✎︎', '#FFEDD5', '#9A3412', 'Leave request'], corr: ['↺', '#EDE9FE', '#5B21B6', 'Attendance detail'], ann: ['📣︎', '#E8ECF2', '#374151', 'Announcement']
    };
    const mk = (id, k, g, title, text, time, unread) => ({ id, g, title, text, time, unread, icon: T[k][0], ibg: T[k][1], ifg: T[k][2], go: T[k][3] });
    return [
      mk(1, 'shift', 'Today', 'Shift starts in 1 hour', 'Chantier Plateau · 08:00 – 17:00', '07:00', true),
      mk(2, 'sched', 'Today', 'Schedule updated by admin', 'Tue 20 Oct moved to Hôpital Cocody, 09:00.', '08:12', true),
      mk(3, 'out', 'Today', 'Don’t forget to check out', 'Your shift ended at 17:00 yesterday.', '06:30', true),
      mk(4, 'ok', 'Earlier', 'Check-in flag resolved', 'Thu 8 Oct: admin confirmed GPS drift.', 'Yesterday', false),
      mk(5, 'leave', 'Earlier', 'Leave approved', 'Annual · 15 – 19 Oct, by Mariam Diallo.', 'Mon', false),
      mk(6, 'flag', 'Earlier', 'Check-in flagged', 'Tue 13 Oct: 140 m outside the site zone.', 'Sun', false),
      mk(7, 'corr', 'Earlier', 'Correction accepted', 'Check-out for 12 Oct set to 17:00.', '13 Oct', false),
      mk(8, 'chg', 'Earlier', 'Changes requested on your leave', 'Admin: please shorten to 4 days.', '12 Oct', false),
      mk(9, 'no', 'Earlier', 'Leave rejected', 'Annual · 10 Aug: staffing minimum.', '8 Aug', false),
      mk(10, 'ann', 'Earlier', 'Announcement: safety briefing', 'Mandatory briefing Friday 08:30 at HQ.', '5 Oct', false)
    ];
  }
  renderVals() {
    const { off, toast, drag } = this.state, all = this.state.items || [];
    const W = 88;
    const flash = m => { this.setState({ toast: m }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 1800); };
    const rows = [];
    ['Today', 'Earlier'].forEach(g => {
      const list = all.filter(i => i.g === g); if (!list.length) return;
      rows.push({ isHead: true, isItem: false, head: g });
      list.forEach(i => {
        const dragging = drag && drag.id === i.id;
        const x = dragging ? drag.x : (off[i.id] ? -W : 0);
        rows.push({ isHead: false, isItem: true, title: i.title, text: i.text, time: i.time, icon: i.icon, ibg: i.ibg, ifg: i.ifg, go: i.go, wbg: x < 0 ? '#DC2626' : 'transparent', dv: x < 0 ? 'visible' : 'hidden', w: i.unread ? 800 : 600, bg: i.unread ? '#F0F6FF' : '#fff', dot: i.unread ? 'visible' : 'hidden', x, tr: dragging ? 'none' : 'transform .2s',
          down: e => { e.currentTarget.setPointerCapture(e.pointerId); this._sx = e.clientX; this._b = off[i.id] ? -W : 0; this.setState({ drag: { id: i.id, x: this._b } }); },
          move: e => { if (this._sx == null) return; this.setState({ drag: { id: i.id, x: Math.max(-W - 20, Math.min(0, this._b + e.clientX - this._sx)) } }); },
          up: e => { const dx = e.clientX - this._sx, fx = drag ? drag.x : 0; this._sx = null;
            if (Math.abs(dx) < 6) { if (off[i.id]) this.setState({ drag: null, off: {} }); else this.setState({ drag: null, items: all.map(n => n.id === i.id ? Object.assign({}, n, { unread: false }) : n) }), flash('Opens ' + i.go); return; }
            this.setState({ drag: null, off: fx < -W / 2 ? { [i.id]: true } : {} }); },
          del: () => this.setState({ items: all.filter(n => n.id !== i.id), off: {} }) });
      });
    });
    const unread = all.some(i => i.unread);
    return {
      rows, empty: this.state.items && all.length === 0, toast, markCol: unread ? '#0A6AE6' : '#8A98AE',
      markAll: () => this.setState({ items: all.map(i => Object.assign({}, i, { unread: false })) }),
      scens: [{ label: 'Reset', go: () => this.setState({ items: this.seed(), off: {} }) }, { label: 'Empty state', go: () => this.setState({ items: [], off: {} }) }]
    };
  }
}
</script>
</body>
</html>
